<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SwiftWork – Login</title>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo-wrap">
      <span class="login-logo-icon">⚡</span>
      <div>
        <div class="login-brand">SwiftWork</div>
        <div class="login-brand-sub">Job Scheduling Platform</div>
      </div>
    </div>

    <div class="login-title">Welcome back</div>
    <div class="login-sub">Sign in to manage your jobs</div>

    <div id="login-error" class="error-box" style="display:none"></div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••"/>
    </div>
    <button class="btn-submit" id="login-btn" onclick="doLogin()" style="margin-top:4px">Sign In</button>

  </div>

  <script>
    async function doLogin() {
      const btn = document.getElementById('login-btn');
      const err = document.getElementById('login-error');
      btn.disabled = true; btn.textContent = 'Signing in...';
      err.style.display = 'none';

      const res = await fetch('/api/login', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
      });
      const data = await res.json();
      if (res.ok) { window.location.href = '/'; }
      else { err.textContent = data.error; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Sign In'; }
    }
    document.addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
  </script>
</body>
</html>
